services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chubb-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: chubb_claims
      POSTGRES_USER: chubb_admin
      POSTGRES_PASSWORD: ChubbSecure2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chubb_admin -d chubb_claims"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      chubb-network:
        aliases:
          - postgres
          - chubb-postgres

  # 2. Apache Kafka Broker (KRaft Mode - No Zookeeper needed)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chubb-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      chubb-network:
        aliases:
          - kafka
          - chubb-kafka

  # 3. Spring Boot Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chubb-backend
    hostname: backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: chubb_claims
      DB_USER: chubb_admin
      DB_PASSWORD: ChubbSecure2026!
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      chubb-network:
        aliases:
          - backend
          - chubb-backend

  # 4. Angular Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chubb-frontend
    hostname: frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      chubb-network:
        aliases:
          - frontend
          - chubb-frontend

volumes:
  postgres_data:

networks:
  chubb-network:
    driver: bridge
